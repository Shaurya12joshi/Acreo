<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Acreo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="output.css" />
</head>
<body class="bg-cream text-ink font-body min-h-screen">

  <header class="border-b border-sand bg-surface">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <div>
        <h1 class="font-display text-2xl font-semibold text-ink">Acreo</h1>
        <p id="listing-count" class="text-sm text-muted mt-0.5">0 listings collected</p>
      </div>
      <button
        id="clear-btn"
        class="text-sm text-muted hover:text-amber border border-sand hover:border-amber rounded-full px-4 py-2 transition-colors cursor-pointer"
      >
        Clear all
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">

    <div id="filters" class="hidden mb-6 flex flex-wrap items-center gap-x-8 gap-y-4">
      <div id="source-filters" class="flex items-center gap-2 flex-wrap"></div>
      <div id="bhk-filters" class="flex items-center gap-2 flex-wrap"></div>
      <div id="furnishing-filters" class="flex items-center gap-2 flex-wrap"></div>
      <div id="tenant-filters" class="flex items-center gap-2 flex-wrap"></div>
      <div id="seen-filters" class="flex items-center gap-2 flex-wrap"></div>
      <button id="reset-filters-btn" class="text-xs text-muted hover:text-amber underline cursor-pointer">
        Reset filters
      </button>
    </div>

    <div id="empty-state" class="hidden text-center py-24">
      <p class="font-display text-xl text-ink mb-2">No listings yet</p>
      <p class="text-muted text-sm">
        Browse rental search results on MagicBricks, 99acres, or NoBroker listings you scroll past will appear here automatically.
      </p>
    </div>

    <div id="table-wrapper" class="hidden bg-surface border border-sand rounded-2xl overflow-hidden">
      <div class="overflow-y-auto max-h-[75vh]">
        <table class="w-full text-sm table-fixed border-separate border-spacing-0">
          <thead>
            <tr class="text-left text-muted sticky top-0 z-10">
              <th class="w-[24%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand">Title</th>
              <th class="w-[13%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand">Price</th>
              <th class="w-[11%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand">Area</th>
              <th class="w-[12%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand">Price/Area</th>
              <th class="w-[11%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand">Type</th>
              <th class="w-[10%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand">Source</th>
              <th class="w-[7%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand"></th>
              <th class="w-[12%] px-3 py-3 font-semibold text-xs uppercase tracking-wide bg-cream border-b border-sand text-right">Details</th>
            </tr>
          </thead>
          <tbody id="listings-body"></tbody>
        </table>
      </div>
    </div>

  </main>

  <div
    id="details-modal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center px-4"
    style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:9999; align-items:center; justify-content:center;"
  >
    <div
      id="details-modal-backdrop"
      class="absolute inset-0 bg-ink/40"
      style="position:absolute; inset:0;"
    ></div>
    <div
      class="relative bg-surface border border-sand rounded-2xl shadow-xl w-full max-w-lg overflow-hidden max-h-[85vh] overflow-y-auto"
      style="position:relative; max-height:85vh; overflow-y:auto;"
    >
      <div class="flex items-center justify-between px-5 py-4 border-b border-sand sticky top-0 bg-surface">
        <h2 id="details-modal-title" class="font-display text-lg font-semibold text-ink">Listing details</h2>
        <button id="details-modal-close" aria-label="Close" class="text-muted hover:text-amber text-xl leading-none px-1 cursor-pointer">&times;</button>
      </div>
      <div class="px-5 py-4">
        <table class="w-full text-sm">
          <tbody id="details-modal-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
